services:
  mongo:
    # 8.0 refuses to start on kernel 6.19+ (SERVER-121912); prod runs 8.0.28
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['./mongo-data:/data/db']
    restart: unless-stopped
  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
    restart: unless-stopped
