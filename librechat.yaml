          come from the user's document is worse than no answer.

          You can read attached files and answer questions about them. You cannot
          edit a document or build a spreadsheet — when the user asks for that,
          say so plainly in one sentence and tell them to switch to the Office
          Assistant, which can return the edited file.

endpoints:
  agents:
    allowedProviders: ['OpenAI', 'Claude', 'BdREN AI', 'OpenRouter', 'OpenRouter Image', 'anthropic']
    # Bounds how much text from a single tool result (e.g. execute_code stdout,
    # OCR'd document text) gets inserted into the conversation per call — without
    # this, a large-document read/edit can dump tens of thousands of characters
    # into context on one turn.
    maxToolResultChars: 25000
    capabilities:
      - 'subagents'
      - 'execute_code'
      - 'file_search'
      - 'artifacts'
      - 'skills'
      - 'tools'
      - 'context'
      - 'ask_user_question'
      # Required before automatic preparation may send a scanned document to OCR.
      # Without it, uploads that need text recognition fail with
      # "OCR capability is not enabled for Agents".
      - 'ocr'

  custom:

    # - name: BdREN AI
    #   apiKey: '${BDREN_AI_API_KEY}'
    #   baseURL: 'https://llm.shuvoo.com/v1'
    #   models:
    #     default:
    #       - 'glm-4.6v'
    #     fetch: false
    #   titleConvo: true
    #   titleModel: 'glm-4.6v'
    #   modelDisplayLabel: 'BdREN AI'

    - name: OpenAI
      apiKey: '${OPENAI_API_KEY}'
      baseURL: 'https://api.openai.com/v1'
      models:
        default:
          - 'gpt-5.6-luna'
        fetch: false
      modelDisplayLabel: OpenAI


    - name: OpenRouter
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - openai/gpt-5.6-luna
          - anthropic/claude-haiku-4.5
        fetch: false
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

    # Separate endpoint so `addParams` below (modalities/image_config) only ever
    # reaches google/gemini-3.1-flash-image. Sending `modalities: ["image","text"]`
    # to Kimi on the shared OpenRouter endpoint 404s the whole request — OpenRouter
    # rejects it outright rather than ignoring the unsupported modality.
    - name: OpenRouter Image
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'google/gemini-3.1-flash-image'
        fetch: false
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter Image'
      # Gemini image models charge a flat ~1120 image tokens regardless of ratio
      # (verified against the live API), so this is a framing choice, not a cost one.
      # `modalities: ['image']` (no 'text') forces the model to always return an
      # image rather than sometimes replying with a text-only answer for prompts
      # it interprets as a question/discussion instead of a generation request
      # (verified: 'Batman vs Superman' produced a 1000+ word essay with no image
      # under ['image','text'], but a real image under ['image'] alone).
      addParams:
        modalities: ['image']
        image_config:
          resolution: '512'
          aspect_ratio: '16:9'

    - name: NVIDIA
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: 'https://integrate.api.nvidia.com/v1'
      models:
        default:
          - 'z-ai/glm-5.2'
        fetch: false
      titleConvo: true
      dropParams: ['stop']
      modelDisplayLabel: 'NVIDIA'
