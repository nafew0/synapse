name: Dev server CI

on:
  push:
    branches: [bdren-dev]
  pull_request:
    branches: [bdren-dev, bdren-prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verify:
    name: Build and type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx turbo run build --force

      - name: Type check data-schemas
        run: npx tsc --noEmit -p packages/data-schemas/tsconfig.json

      - name: Type check @librechat/api
        run: npx tsc --noEmit -p packages/api/tsconfig.json

      - name: Type check client
        run: cd client && npx tsc --noEmit -p .

  test:
    name: Unit tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [api, packages-api, data-schemas, client]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build packages
        run: npm run build:packages

      - name: Prepare api test files
        if: matrix.suite == 'api'
        run: |
          mkdir -p api/data
          echo '{}' > api/data/auth.json
          cp api/test/.env.test.example api/test/.env.test

      - name: Run tests
        run: |
          case "${{ matrix.suite }}" in
            api) cd api && npm run test:ci ;;
            packages-api) cd packages/api && npm run test:ci ;;
            data-schemas) cd packages/data-schemas && npm run test:ci ;;
            client) cd client && npm run test:ci ;;
          esac
