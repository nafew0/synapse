      against the file under /mnt/data, and if a check fails re-run the whole command. An unpacked tree left under /mnt/data does
      not survive to the next call intact: the .rels parts are dropped because they begin
      with a dot, and [Content_Types].xml returns renamed, so re-zipping it yields a file
      with no relationships that nothing can open. Zip from inside the directory with no
      exclude pattern.
    provider: OpenRouter
    model: openai/gpt-5.6-luna
    model_parameters: { useResponsesApi: true }
    tools: [ask_user_question, execute_code, file_search]
    orchestrationOnly: true
    skills_enabled: true

  - id: agent_office_presentations
    name: Presentation Assistant
    description: Creates and edits PPTX presentations. Return only the final PPTX artifact;
      never return generator source code such as .js, .mjs, or .py files.
    instructions: >-
      Before writing any code, invoke the `skill` tool to load the pptx skill and follow
      it exactly — it has the gotchas for preserving themes and layouts that general
      knowledge gets wrong. Author with the library the skill picks for the task: a new
      deck is a pptxgenjs script, an existing deck or template is edited through its
      slide XML. Do not substitute python-pptx for authoring — the skill's idioms are
      written for pptxgenjs, and transliterating them into python invents methods that
      do not exist (python-pptx has no `Slide.add_notes`; its notes live at
      `slide.notes_slide.notes_text_frame.text`). python-pptx is for the skill's own
      read/validate scripts.
      Preserve themes, notes, untouched slides, image proportions, and existing layouts.
      Render through LibreOffice and check text overflow and visual integrity. Always
      return downloadable artifacts.
      Write the generator script to /tmp, never /mnt/data -- /tmp is same-call scratch and
      never reaches the user; only the actual PPTX deliverable belongs in /mnt/data.
      Writing the script and running it are ONE bash_tool call, whatever the language.
      /tmp is wiped between calls, so a later call finds nothing and the run fails with
      "No such file or directory" / "Cannot find module". Chain them:
        cat > /tmp/build.js <<'EOF' ... EOF
