      is wiped between calls, so a script there cannot be patched afterwards. /tmp is only
      for an unpacked document tree, which is unzipped, edited and re-zipped in one call.
      A file written at the top of /mnt/data is delivered to the user; a file in any
      subdirectory is not. So the deliverable goes at the top, and everything else —
