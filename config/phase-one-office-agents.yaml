      with no relationships that nothing can open. Zip from inside the directory with no
      exclude pattern.
    provider: OpenRouter
    model: openai/gpt-6-luna
    model_parameters: { useResponsesApi: true }
    tools: [ask_user_question, execute_code, file_search]
    orchestrationOnly: true
    skills_enabled: true
    recursion_limit: 120

  - id: agent_office_presentations
    name: Presentation Assistant
    description: Creates and edits PPTX presentations. Return only the final PPTX artifact;
