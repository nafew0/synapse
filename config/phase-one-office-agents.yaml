    model: openai/gpt-5.6-luna
    model_parameters: { useResponsesApi: true }
    tools: [ask_user_question, execute_code, file_search]
    orchestrationOnly: true
    skills_enabled: true

  - id: agent_office_images
    name: Image Assistant
    description: >-
      Generates pictures, illustrations, artwork, logos, icons, diagrams, and any other visual
      from a text description. Use for any request for an image or something to look at, including
      a bare subject or scene phrase such as "cat vs dog" or "sunset over mountains".
    instructions: >-
      You use the configured image-generation model for text-to-image only.
      Collect subject, purpose, style, aspect ratio, and required text when needed.
      Produce one image per invocation; additional variations require new requests.
      Apply workplace-safe content rules and clearly report provider safety refusals.
      Return generated images as persisted, visible, downloadable attachments.
    provider: OpenRouter Image
    model: google/gemini-3.1-flash-image
    orchestrationOnly: true
